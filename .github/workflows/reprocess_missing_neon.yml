name: Rattrapage intégration Neon

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Début de la fenêtre ISO 8601"
        required: true
        type: string
        default: "2026-10-02T18:23:13Z"
      end:
        description: "Fin de la fenêtre ISO 8601"
        required: true
        type: string
        default: "2026-10-07T12:00:00Z"
      batch_size:
        description: "Nombre de RAW par lot LLM"
        required: true
        type: number
        default: 250

permissions:
  contents: read

concurrency:
  group: ouaga-foncier-rattrapage-neon
  cancel-in-progress: false

jobs:
  rattrapage:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Installation des dépendances
        run: pip install -r requirements.txt
      - name: Rattrapage des annonces absentes
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python scripts/reprocess_missing_neon.py \
            --start "${{ inputs.start }}" \
            --end "${{ inputs.end }}" \
            --batch-size "${{ inputs.batch_size }}"
      - name: Vérification finale Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<PYEOF
          import os, psycopg
          with psycopg.connect(os.environ["DATABASE_URL"]) as conn:
              with conn.cursor() as cur:
                  cur.execute("SELECT COUNT(*) FROM public.annonces")
                  print("annonces_total=", cur.fetchone()[0])
                  cur.execute("""SELECT COUNT(*) FROM public.raw_posts_checkpoint r LEFT JOIN public.annonces a ON a.id=r.post_id WHERE r.captured_at >= %s AND r.captured_at <= %s AND a.id IS NULL""", ("${{ inputs.start }}", "${{ inputs.end }}"))
                  remaining = cur.fetchone()[0]
                  print("raw_absents_apres_rattrapage=", remaining)
                  print("Ces RAW peuvent être des posts rejetés/non-immobiliers ; le nombre n’est pas un échec du rattrapage.")
          PYEOF