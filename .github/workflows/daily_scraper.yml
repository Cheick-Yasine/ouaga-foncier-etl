name: Pipeline ETL Annonces Foncières Ouagadougou

on:
  push:
    branches: [fix/collecte-durable-sans-proxy]
    paths: [.github/workflows/daily_scraper.yml]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      compte:
        description: "Compte à tester (all = les cinq comptes)"
        type: choice
        options: [all, "1", "2", "3", "4", "5"]
        default: all
      days_back:
        description: "Jours à rattraper (1 à 14)"
        type: string
        default: "10"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ouaga_foncier_etl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: "Checkout du dépôt"
        uses: actions/checkout@v4

      - name: "Configuration Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: "Installation des dépendances"
        run: pip install -r requirements.txt

      - name: "Suite de tests (pytest)"
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ouaga_foncier_etl_test
        run: pytest -q

  scrape-and-process:
    # Rattrapage ponctuel hébergé chez GitHub, indépendant du PC.
    if: github.event_name != 'pull_request'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        compte: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.compte != 'all' && format('["{0}"]', inputs.compte) || '["1","2","3","4","5"]') }}
    concurrency:
      group: ouaga-foncier-etl-compte-${{ matrix.compte }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"
          cache: pip
      - name: Dépendances
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Rattrapage et traitement
        timeout-minutes: 340
        env:
          COMPTE: ${{ matrix.compte }}
          DAYS_BACK: ${{ inputs.days_back || '10' }}
          COOKIES_COMPTE: ${{ secrets[format('FB_COOKIES_JSON_{0}', matrix.compte)] }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OUAGA_PERSISTENT_DIR: ${{ runner.temp }}/ouaga-backfill
        run: python scripts/github_backfill.py
