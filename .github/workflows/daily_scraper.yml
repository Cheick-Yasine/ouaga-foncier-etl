name: Pipeline ETL Annonces Foncières Ouagadougou

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      compte:
        description: "Compte à tester (all = les cinq comptes)"
        type: choice
        options: [all, "1", "2", "3", "4", "5"]
        default: all

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ouaga_foncier_etl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: "Checkout du dépôt"
        uses: actions/checkout@v4

      - name: "Configuration Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: "Installation des dépendances"
        run: pip install -r requirements.txt

      - name: "Suite de tests (pytest)"
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ouaga_foncier_etl_test
        run: pytest -q

  scrape-and-process:
    # Collecte locale planifiée par le système ; GitHub sert au lancement manuel.
    # Activer la variable seulement après installation du runner persistant.
    if: github.event_name == 'workflow_dispatch' && vars.OUAGA_LOCAL_RUNNER_READY == 'true'
    needs: tests
    runs-on: [self-hosted, linux, ouaga-etl]
    timeout-minutes: 360
    concurrency:
      group: ouaga-etl-local
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Collecte et reprise sur le stockage local
        env:
          COMPTE: ${{ inputs.compte }}
          OUAGA_PERSISTENT_DIR: ${{ vars.OUAGA_PERSISTENT_DIR }}
        run: |
          test -n "$OUAGA_PERSISTENT_DIR"
          "$OUAGA_PERSISTENT_DIR/venv/bin/python" scripts/daily.py --compte "$COMPTE"
