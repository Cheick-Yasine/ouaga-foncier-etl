name: Pipeline ETL Annonces Foncières Ouagadougou

on:
  pull_request:
    branches: [main]
  schedule:
    # Le scraping s'exécute sur le PC auto-hébergé. Un délai aléatoire de
    # 0 à 30 minutes est ajouté au démarrage de chaque cron.
    - cron: "17 0 * * *"
    - cron: "41 12 * * *"
  workflow_dispatch:
    inputs:
      compte:
        description: "Compte à tester (all = les cinq comptes)"
        type: choice
        options: [all, "1", "2", "3", "4", "5"]
        default: all
      mode:
        description: "Mode d'exécution"
        type: choice
        options: [daily, backfill]
        default: daily
      days_back:
        description: "Nombre de jours à remonter"
        type: string
        default: "7"
      network_mode:
        description: "Sortie réseau du runner auto-hébergé"
        type: choice
        options: [direct, proxy]
        default: direct
      round_robin:
        description: "Round-robin (1-2 groupes/run)"
        type: boolean
        default: false
      groups_per_run:
        description: "Nombre de groupes si round_robin=true"
        type: string
        default: "1"
      group_limit:
        description: "Nombre max de groupes (0 = tous)"
        type: string
        default: "0"
      batch_size:
        description: "Taille des lots de groupes"
        type: string
        default: "5"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ouaga_foncier_etl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: "Checkout du dépôt"
        uses: actions/checkout@v4

      - name: "Configuration Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: "Installation des dépendances"
        run: pip install -r requirements.txt

      - name: "Suite de tests (pytest)"
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ouaga_foncier_etl_test
        run: pytest -q

  scrape-and-process:
    if: github.event_name != 'pull_request'
    needs: tests
    runs-on: [self-hosted, Windows, X64, ouaga-foncier]
    strategy:
      fail-fast: false
      matrix:
        compte: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.compte != 'all' && format('["{0}"]', inputs.compte) || '["1","2","3","4","5"]') }}
    timeout-minutes: 360
    concurrency:
      group: ouaga-foncier-etl-compte-${{ matrix.compte }}
      cancel-in-progress: false
    steps:
      - name: "Checkout du dépôt sans supprimer l'état local"
        uses: actions/checkout@v4
        with:
          clean: false

      - name: "Configuration Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: "Installation des dépendances Python"
        shell: pwsh
        run: python -m pip install -r requirements.txt

      - name: "Installation de Chromium (Playwright)"
        shell: pwsh
        run: python -m playwright install chromium

      - name: "Délai aléatoire avant démarrage (cron uniquement)"
        if: github.event_name == 'schedule'
        shell: pwsh
        run: |
          $delai = Get-Random -Minimum 0 -Maximum 1801
          Write-Host "Délai aléatoire : $delai seconde(s)."
          Start-Sleep -Seconds $delai

      - name: "Résolution des paramètres d'exécution"
        id: params
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "schedule") {
            "mode=daily" >> $env:GITHUB_OUTPUT
            "days_back=1" >> $env:GITHUB_OUTPUT
            "network_mode=direct" >> $env:GITHUB_OUTPUT
            "round_robin=false" >> $env:GITHUB_OUTPUT
            "groups_per_run=1" >> $env:GITHUB_OUTPUT
            "group_limit=0" >> $env:GITHUB_OUTPUT
            "batch_size=5" >> $env:GITHUB_OUTPUT
          } else {
            "mode=${{ github.event.inputs.mode }}" >> $env:GITHUB_OUTPUT
            "days_back=${{ github.event.inputs.days_back }}" >> $env:GITHUB_OUTPUT
            "network_mode=${{ github.event.inputs.network_mode }}" >> $env:GITHUB_OUTPUT
            "round_robin=${{ github.event.inputs.round_robin }}" >> $env:GITHUB_OUTPUT
            "groups_per_run=${{ github.event.inputs.groups_per_run }}" >> $env:GITHUB_OUTPUT
            "group_limit=${{ github.event.inputs.group_limit }}" >> $env:GITHUB_OUTPUT
            "batch_size=${{ github.event.inputs.batch_size }}" >> $env:GITHUB_OUTPUT
          }

      - name: "Exécution du pipeline ETL"
        shell: pwsh
        env:
          FB_COOKIES_JSON_1: ${{ secrets.FB_COOKIES_JSON_1 }}
          FB_COOKIES_JSON_2: ${{ secrets.FB_COOKIES_JSON_2 }}
          FB_COOKIES_JSON_3: ${{ secrets.FB_COOKIES_JSON_3 }}
          FB_COOKIES_JSON_4: ${{ secrets.FB_COOKIES_JSON_4 }}
          FB_COOKIES_JSON_5: ${{ secrets.FB_COOKIES_JSON_5 }}
          ALLOW_DIRECT_CONNECTION: ${{ steps.params.outputs.network_mode == 'direct' && 'true' || 'false' }}
          PROXY_URL_1: ${{ steps.params.outputs.network_mode == 'proxy' && secrets.PROXY_URL_1 || '' }}
          PROXY_URL_2: ${{ steps.params.outputs.network_mode == 'proxy' && secrets.PROXY_URL_2 || '' }}
          PROXY_URL_3: ${{ steps.params.outputs.network_mode == 'proxy' && secrets.PROXY_URL_3 || '' }}
          PROXY_URL_4: ${{ steps.params.outputs.network_mode == 'proxy' && secrets.PROXY_URL_4 || '' }}
          PROXY_URL_5: ${{ steps.params.outputs.network_mode == 'proxy' && secrets.PROXY_URL_5 || '' }}
          PROXY_COUNTRY_1: ${{ steps.params.outputs.network_mode == 'direct' && 'BF' || vars.PROXY_COUNTRY_1 || 'BF' }}
          PROXY_COUNTRY_2: ${{ steps.params.outputs.network_mode == 'direct' && 'BF' || vars.PROXY_COUNTRY_2 || 'BF' }}
          PROXY_COUNTRY_3: ${{ steps.params.outputs.network_mode == 'direct' && 'BF' || vars.PROXY_COUNTRY_3 || 'BF' }}
          PROXY_COUNTRY_4: ${{ steps.params.outputs.network_mode == 'direct' && 'BF' || vars.PROXY_COUNTRY_4 || 'BF' }}
          PROXY_COUNTRY_5: ${{ steps.params.outputs.network_mode == 'direct' && 'BF' || vars.PROXY_COUNTRY_5 || 'BF' }}
          BROWSER_LOCALE_1: ${{ steps.params.outputs.network_mode == 'direct' && 'fr-FR' || vars.BROWSER_LOCALE_1 || 'fr-FR' }}
          BROWSER_LOCALE_2: ${{ steps.params.outputs.network_mode == 'direct' && 'fr-FR' || vars.BROWSER_LOCALE_2 || 'fr-FR' }}
          BROWSER_LOCALE_3: ${{ steps.params.outputs.network_mode == 'direct' && 'fr-FR' || vars.BROWSER_LOCALE_3 || 'fr-FR' }}
          BROWSER_LOCALE_4: ${{ steps.params.outputs.network_mode == 'direct' && 'fr-FR' || vars.BROWSER_LOCALE_4 || 'fr-FR' }}
          BROWSER_LOCALE_5: ${{ steps.params.outputs.network_mode == 'direct' && 'fr-FR' || vars.BROWSER_LOCALE_5 || 'fr-FR' }}
          BROWSER_TIMEZONE_1: ${{ steps.params.outputs.network_mode == 'direct' && 'Africa/Ouagadougou' || vars.BROWSER_TIMEZONE_1 || 'Africa/Ouagadougou' }}
          BROWSER_TIMEZONE_2: ${{ steps.params.outputs.network_mode == 'direct' && 'Africa/Ouagadougou' || vars.BROWSER_TIMEZONE_2 || 'Africa/Ouagadougou' }}
          BROWSER_TIMEZONE_3: ${{ steps.params.outputs.network_mode == 'direct' && 'Africa/Ouagadougou' || vars.BROWSER_TIMEZONE_3 || 'Africa/Ouagadougou' }}
          BROWSER_TIMEZONE_4: ${{ steps.params.outputs.network_mode == 'direct' && 'Africa/Ouagadougou' || vars.BROWSER_TIMEZONE_4 || 'Africa/Ouagadougou' }}
          BROWSER_TIMEZONE_5: ${{ steps.params.outputs.network_mode == 'direct' && 'Africa/Ouagadougou' || vars.BROWSER_TIMEZONE_5 || 'Africa/Ouagadougou' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          $argumentsPipeline = @(
            "--compte", "${{ matrix.compte }}",
            "--mode", "${{ steps.params.outputs.mode }}",
            "--days-back", "${{ steps.params.outputs.days_back }}",
            "--group-limit", "${{ steps.params.outputs.group_limit }}",
            "--batch-size", "${{ steps.params.outputs.batch_size }}"
          )
          if ("${{ steps.params.outputs.round_robin }}" -eq "true") {
            $argumentsPipeline += @(
              "--round-robin",
              "--groups-per-run", "${{ steps.params.outputs.groups_per_run }}"
            )
          }
          python main.py @argumentsPipeline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: "Emplacement des résultats locaux"
        if: always()
        shell: pwsh
        run: |
          Write-Host "État local : $env:GITHUB_WORKSPACE\data\state\compte_${{ matrix.compte }}"
          Write-Host "Résultats locaux : $env:GITHUB_WORKSPACE\data\processed"
          Write-Host "Logs locaux : $env:GITHUB_WORKSPACE\data\logs"
