name: Pipeline ETL Annonces Foncières Ouagadougou

on:
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode d'exécution"
        type: choice
        options: [daily, backfill]
        default: daily
      days_back:
        description: "Nombre de jours à remonter"
        type: string
        default: "7"
      round_robin:
        description: "Round-robin plutôt que tous les groupes"
        type: boolean
        default: false
      groups_per_run:
        description: "Nombre de groupes en round-robin"
        type: string
        default: "1"
      group_limit:
        description: "Nombre max de groupes (0 = tous)"
        type: string
        default: "0"
      batch_size:
        description: "Taille des lots de groupes"
        type: string
        default: "5"

permissions:
  contents: read

concurrency:
  group: ouaga-foncier-etl
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ouaga_foncier_etl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Configuration Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installation des dépendances
        run: pip install -r requirements.txt

      - name: Suite de tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ouaga_foncier_etl_test
        run: pytest -q

  scrape-and-process:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Configuration Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installation des dépendances Python
        run: pip install -r requirements.txt

      - name: Installation de Chromium
        run: playwright install --with-deps chromium

      - name: Restauration de l'état persistant
        uses: actions/cache/restore@v4
        with:
          path: data/state
          key: etat-scraper-${{ github.run_id }}
          restore-keys: |
            etat-scraper-

      - name: Délai aléatoire avant démarrage
        if: github.event_name == 'schedule'
        run: sleep $(( RANDOM % 1800 ))

      - name: Résolution des paramètres
        id: params
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "mode=daily" >> "$GITHUB_OUTPUT"
            echo "days_back=1" >> "$GITHUB_OUTPUT"
            echo "round_robin=false" >> "$GITHUB_OUTPUT"
            echo "groups_per_run=1" >> "$GITHUB_OUTPUT"
            echo "group_limit=0" >> "$GITHUB_OUTPUT"
            echo "batch_size=5" >> "$GITHUB_OUTPUT"
          else
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
            echo "days_back=${{ github.event.inputs.days_back }}" >> "$GITHUB_OUTPUT"
            echo "round_robin=${{ github.event.inputs.round_robin }}" >> "$GITHUB_OUTPUT"
            echo "groups_per_run=${{ github.event.inputs.groups_per_run }}" >> "$GITHUB_OUTPUT"
            echo "group_limit=${{ github.event.inputs.group_limit }}" >> "$GITHUB_OUTPUT"
            echo "batch_size=${{ github.event.inputs.batch_size }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Exécution du pipeline ETL résilient
        id: pipeline
        env:
          FB_COOKIES_JSON: ${{ secrets.FB_COOKIES_JSON }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          ARGS=(
            --mode "${{ steps.params.outputs.mode }}"
            --days-back "${{ steps.params.outputs.days_back }}"
            --group-limit "${{ steps.params.outputs.group_limit }}"
            --batch-size "${{ steps.params.outputs.batch_size }}"
          )
          if [ "${{ steps.params.outputs.round_robin }}" = "true" ]; then
            ARGS+=(--round-robin --groups-per-run "${{ steps.params.outputs.groups_per_run }}")
          fi
          python scripts/resilient_entrypoint.py "${ARGS[@]}"

      - name: Traitement de secours des RAW déjà récupérés
        if: always() && steps.pipeline.outcome == 'failure'
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/process_recovered_raw.py

      - name: Installer pg_dump compatible avec Neon
        if: always()
        continue-on-error: true
        run: |
          attendre_deverrouillage_apt() {
            for _ in $(seq 1 24); do
              if sudo fuser /var/lib/apt/lists/lock >/dev/null 2>&1; then
                sleep 5
              else
                return 0
              fi
            done
          }
          attendre_deverrouillage_apt
          sudo apt-get install -y postgresql-common
          attendre_deverrouillage_apt
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          attendre_deverrouillage_apt
          sudo apt-get install -y postgresql-client-18

      - name: Sauvegarde SQL de la base maître
        if: always()
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          PG_DUMP_BIN="/usr/lib/postgresql/18/bin/pg_dump"
          if [ ! -x "$PG_DUMP_BIN" ]; then
            PG_DUMP_BIN="pg_dump"
          fi
          "$PG_DUMP_BIN" "$DATABASE_URL" --no-owner --no-privileges -f data/processed/annonces_backup.sql || true

      - name: Upload des données récupérées et des exports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "annonces-foncieres-${{ github.run_id }}"
          path: |
            data/raw/*.json
            data/raw/_live/*.json
            data/processed/annonces_backup.sql
            data/processed/annonces.xlsx
            data/processed/annonces_*.csv
            data/processed/rejetes_*.json
            data/logs/*.log
            data/logs/debug_page_vide_*.html
            data/logs/debug_scroll_vide_*.json
          retention-days: 30
          if-no-files-found: warn

      - name: Sauvegarde de l'état persistant pour le prochain run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/state
          key: etat-scraper-${{ github.run_id }}
