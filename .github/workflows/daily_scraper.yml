name: Pipeline ETL Annonces Foncières Ouagadougou

on:
  schedule:
    # Deux créneaux/jour. Minutes NON nulles (jitter permanent dans l'expression
    # cron elle-même). Changer manuellement la minute tous les mois pour
    # éviter un motif trop régulier (ex. 17 -> 41, 41 -> 8, etc.).
    # Jitter supplémentaire 0-30 min dans le step "Délai aléatoire" ci-dessous.
    - cron: "17 0 * * *"
    - cron: "41 12 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode d'exécution"
        type: choice
        options: [daily, backfill]
        default: daily
      days_back:
        description: "Nombre de jours à remonter (surtout pertinent en mode backfill)"
        type: string
        default: "7"
      round_robin:
        description: "Round-robin (1-2 groupes/run) plutôt que tous les groupes d'un coup"
        type: boolean
        default: false
      groups_per_run:
        description: "Nombre de groupes traités ce run (utilisé si round_robin=true)"
        type: string
        default: "1"
      group_limit:
        description: "Nombre max de groupes traités sur ce run (ignoré si round_robin=true ; 0 = tous)"
        type: string
        default: "0"
      batch_size:
        description: "Taille des lots de groupes entre deux pauses longues anti-détection"
        type: string
        default: "5"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ouaga_foncier_etl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: "Checkout du dépôt"
        uses: actions/checkout@v4

      - name: "Configuration Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: "Installation des dépendances"
        run: pip install -r requirements.txt

      - name: "Suite de tests (pytest)"
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ouaga_foncier_etl_test
        run: pytest -q

  scrape-and-process:
    needs: tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compte: ["1", "2", "3", "4", "5"]
    timeout-minutes: 360
    concurrency:
      group: ouaga-foncier-etl-compte-${{ matrix.compte }}
      cancel-in-progress: false
    steps:
      - name: "Checkout du dépôt"
        uses: actions/checkout@v4

      - name: "Configuration Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: "Installation des dépendances Python"
        run: pip install -r requirements.txt

      - name: "Installation de Chromium (Playwright)"
        run: playwright install --with-deps chromium

      - name: "Restauration de l'état persistant (data/state/compte_<n>)"
        uses: actions/cache/restore@v4
        with:
          path: data/state/compte_${{ matrix.compte }}
          key: etat-scraper-compte-${{ matrix.compte }}-${{ github.run_id }}
          restore-keys: |
            etat-scraper-compte-${{ matrix.compte }}-

      - name: "Délai aléatoire avant démarrage (cron uniquement)"
        if: github.event_name == 'schedule'
        run: sleep $(( RANDOM % 1800 ))  # 0 à 30 minutes (jitter permanent)

      - name: "Résolution des paramètres d'exécution"
        id: params
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "mode=daily" >> "$GITHUB_OUTPUT"
            echo "days_back=1" >> "$GITHUB_OUTPUT"
            echo "round_robin=false" >> "$GITHUB_OUTPUT"
            echo "groups_per_run=1" >> "$GITHUB_OUTPUT"
            echo "group_limit=0" >> "$GITHUB_OUTPUT"
            echo "batch_size=5" >> "$GITHUB_OUTPUT"
          else
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
            echo "days_back=${{ github.event.inputs.days_back }}" >> "$GITHUB_OUTPUT"
            echo "round_robin=${{ github.event.inputs.round_robin }}" >> "$GITHUB_OUTPUT"
            echo "groups_per_run=${{ github.event.inputs.groups_per_run }}" >> "$GITHUB_OUTPUT"
            echo "group_limit=${{ github.event.inputs.group_limit }}" >> "$GITHUB_OUTPUT"
            echo "batch_size=${{ github.event.inputs.batch_size }}" >> "$GITHUB_OUTPUT"
          fi

      - name: "Exécution du pipeline ETL"
        env:
          FB_COOKIES_JSON_1: ${{ secrets.FB_COOKIES_JSON_1 }}
          FB_COOKIES_JSON_2: ${{ secrets.FB_COOKIES_JSON_2 }}
          FB_COOKIES_JSON_3: ${{ secrets.FB_COOKIES_JSON_3 }}
          FB_COOKIES_JSON_4: ${{ secrets.FB_COOKIES_JSON_4 }}
          FB_COOKIES_JSON_5: ${{ secrets.FB_COOKIES_JSON_5 }}
          PROXY_URL_1: ${{ secrets.PROXY_URL_1 }}
          PROXY_URL_2: ${{ secrets.PROXY_URL_2 }}
          PROXY_URL_3: ${{ secrets.PROXY_URL_3 }}
          PROXY_URL_4: ${{ secrets.PROXY_URL_4 }}
          PROXY_URL_5: ${{ secrets.PROXY_URL_5 }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          ARGS=(
            --compte "${{ matrix.compte }}"
            --mode "${{ steps.params.outputs.mode }}"
            --days-back "${{ steps.params.outputs.days_back }}"
            --group-limit "${{ steps.params.outputs.group_limit }}"
            --batch-size "${{ steps.params.outputs.batch_size }}"
          )
          if [ "${{ steps.params.outputs.round_robin }}" = "true" ]; then
            ARGS+=(--round-robin --groups-per-run "${{ steps.params.outputs.groups_per_run }}")
          fi
          python main.py "${ARGS[@]}"

      - name: "Installer pg_dump compatible avec la version PostgreSQL de Neon"
        if: always()
        continue-on-error: true
        run: |
          attendre_deverrouillage_apt() {
            for _ in $(seq 1 24); do
              if sudo fuser /var/lib/apt/lists/lock >/dev/null 2>&1; then
                echo "Verrou apt détenu par un autre processus, attente 5s..."
                sleep 5
              else
                return 0
              fi
            done
            echo "::warning::Verrou apt toujours détenu après 2 min d'attente - tentative quand même."
          }

          attendre_deverrouillage_apt
          sudo apt-get install -y postgresql-common
          attendre_deverrouillage_apt
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          attendre_deverrouillage_apt
          sudo apt-get install -y postgresql-client-18

      - name: "Sauvegarde SQL de la base maître (pg_dump)"
        if: always()
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          PG_DUMP_BIN="/usr/lib/postgresql/18/bin/pg_dump"
          if [ ! -x "$PG_DUMP_BIN" ]; then
            echo "::warning::$PG_DUMP_BIN introuvable, repli sur 'pg_dump' générique (risque de mismatch de version serveur)"
            PG_DUMP_BIN="pg_dump"
          fi
          "$PG_DUMP_BIN" --version || true
          "$PG_DUMP_BIN" "$DATABASE_URL" --no-owner --no-privileges -f data/processed/annonces_backup.sql || true

      - name: "Upload de l'artefact (dump base maître, Excel, CSV du run, logs)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "annonces-foncieres-compte-${{ matrix.compte }}-${{ github.run_id }}"
          path: |
            data/processed/annonces_backup.sql
            data/processed/annonces.xlsx
            data/processed/annonces_*.csv
            data/processed/rejetes_*.json
            data/logs/*.log
            data/logs/debug_page_vide_*.html
            data/logs/debug_scroll_vide_*.json
          retention-days: 30
          if-no-files-found: warn

      - name: "Sauvegarde de l'état persistant pour le prochain run"
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/state/compte_${{ matrix.compte }}
          key: etat-scraper-compte-${{ matrix.compte }}-${{ github.run_id }}
